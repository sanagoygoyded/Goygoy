<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gods of Egypt (2016) - Gerçekçi 3B İnsan, Tanrıça & Tanrı Anatomisi Motoru</title>
    <script src="vendor/tailwindcss.js"></script>
    <script src="vendor/three.min.js"></script>
    <script src="webglSupport.js"></script>
    <script src="cinematicWorld.js"></script>
    <link rel="stylesheet" href="gameHud.css">
    <script src="errorHandler.js"></script>
    <script src="loadingScreen.js"></script>
    <script src="svg-icons.js"></script>
    <script src="gameState.js"></script>
    <script src="gameAudio.js"></script>
    <script src="tutorialSystem.js"></script>
    <script src="npcSystem.js"></script>
    <script src="gameHud.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #110a06;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            min-height: 100dvh;
            max-width: 100%;
            overscroll-behavior: none;
        }
        body > canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        .ui-glass {
            background: rgba(18, 10, 6, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.42);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.72);
        }
        .char-pill {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .char-pill.active {
            background: linear-gradient(135deg, #fde047 0%, #f59e0b 55%, #b45309 100%);
            color: #1c1004;
            border-color: #fef9c3;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.75);
            transform: translateY(-1px);
        }
        .gold-btn {
            background: linear-gradient(135deg, #fde047 0%, #f59e0b 50%, #d97706 100%);
            color: #1c1004;
            border: 1px solid #fef08a;
        }
        .action-btn:active { transform: scale(0.93); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-amber-100 overflow-hidden">

    <!-- ÜST KARAKTER SEÇİM ÇUBUĞU (TANRIÇALAR, KADIN KÖYLÜLER VE TANRILAR) -->
    <div class="fixed top-3 left-1/2 -translate-x-1/2 z-20 ui-glass px-2.5 py-1.5 rounded-2xl flex items-center gap-1.5 max-w-[96vw] overflow-x-auto no-scrollbar">
        <button onclick="selectCharacter(0)" id="pill-0" class="char-pill active px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 whitespace-nowrap">
            Zaya (Ölümlü Güzeli)
        </button>
        <button onclick="selectCharacter(1)" id="pill-1" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Hathor (Aşk Tanrıçası)
        </button>
        <button onclick="selectCharacter(2)" id="pill-2" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Nephthys (Kanatlı Tanrıça)
        </button>
        <button onclick="selectCharacter(3)" id="pill-3" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            İsis (Büyü Kraliçesi)
        </button>
        <button onclick="selectCharacter(4)" id="pill-4" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Astarte (Savaş Tanrıçası)
        </button>
        <button onclick="selectCharacter(5)" id="pill-5" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Anat (Av Tanrıçası)
        </button>
        <button onclick="selectCharacter(6)" id="pill-6" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Bastet (Kedi & Dans Tanrıçası)
        </button>
        <button onclick="selectCharacter(7)" id="pill-7" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Nil Köylü Güzeli
        </button>
        <button onclick="selectCharacter(8)" id="pill-8" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Tapınak Dansçısı
        </button>
        <button onclick="selectCharacter(9)" id="pill-9" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            İnsan Horus (2.8m)
        </button>
        <button onclick="selectCharacter(10)" id="pill-10" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Horus Zırh (3.5m)
        </button>
        <button onclick="selectCharacter(11)" id="pill-11" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Set Zırh (3.6m)
        </button>
        <button onclick="selectCharacter(12)" id="pill-12" class="char-pill px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-amber-500/30 text-amber-200/90 whitespace-nowrap">
            Ölümlü Bek
        </button>
        <button onclick="enterWorldWithCharacter()" class="gold-btn px-4 py-1.5 rounded-xl text-xs font-black ml-1.5 shadow-lg whitespace-nowrap">
            ▶ Bu Formla Dünyaya Gir
        </button>
    </div>

    <!-- SEÇİLİ KARAKTER BİLGİ ETİKETİ -->
    <div class="fixed top-16 left-1/2 -translate-x-1/2 z-20 ui-glass px-4 py-1 rounded-full flex items-center gap-2 pointer-events-none whitespace-nowrap">
        <span id="char-badge-title" class="text-xs font-black text-amber-300 tracking-wide">Zaya (Ölümlü Baş Güzeli)</span>
        <span class="text-amber-500/60">•</span>
        <span id="char-badge-desc" class="text-[11px] text-amber-100/90">Dinamik Kumaş Fiziği • Çarpışmasız (Zero-Clipping) 3B Mücevherli Büstiyer & Etek</span>
    </div>

    <!-- SOL ALT: MOBİL YÜRÜME JOYSTICK -->
    <div id="joystick-zone" class="fixed bottom-6 left-6 w-32 h-32 ui-glass rounded-full flex items-center justify-center z-20 touch-none">
        <div class="w-20 h-20 rounded-full border border-amber-400/30 pointer-events-none"></div>
        <div id="joystick-knob" class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-700 via-amber-400 to-yellow-200 border-2 border-white/90 shadow-xl absolute pointer-events-none transition-transform duration-75"></div>
    </div>

    <!-- SAĞ ALT: KAMERA AÇISI VE POZ KONTROLLERİ -->
    <div class="fixed bottom-6 right-6 z-20 flex flex-col items-end gap-2">
        <div class="flex flex-wrap justify-end gap-1.5">
            <button onclick="toggleActionPose()" id="btn-wings" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300 border border-amber-400/40">
                Cazibe / Kanat Pozu
            </button>
            <button onclick="focusBodySculpt()" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-200">
                Vücut / Sütyen & Kalça
            </button>
            <button onclick="focusFace()" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-200">
                Yüz & Saç Detayı
            </button>
            <button onclick="resetCameraView()" class="action-btn ui-glass px-3 py-1.5 rounded-xl text-xs font-semibold text-amber-200">
                Tam Boy
            </button>
        </div>
        <div class="ui-glass px-3 py-1.5 rounded-xl text-[11px] text-amber-200/90 pointer-events-none">
            Ekranı kaydır: 360° Kamera • İki parmak / Tekerlek: Yakınlaştır
        </div>
    </div>

    <script src="kizCharacterEngine.js"></script>
</body>
</html>
